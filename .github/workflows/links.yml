# Checks every external link on the site each Monday (and on demand). The report is in the run summary;
# a broken link fails the run, and GitHub emails the repository owner.
name: Link check
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      # actions are pinned to a commit (a tag can be moved); the comment names the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - run: node tools/check_links.js
