# Runs the whole test suite (pages in Arabic and English, journey rules, content, lab challenges) on every
# push and pull request, and checks that the generated files are up to date with their sources.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to a commit (a tag can be moved); the comment names the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Generated files match their sources
        run: |
          npm run build
          git diff --exit-code -- content assets/data sw.js '*.html' sitemap.xml || (echo "::error::Run npm run build and commit the result" && exit 1)
      - run: npm test
      - name: Accessibility (axe-core in Chrome)
        run: npm run a11y
      - name: Security (XSS payloads everywhere, code runner isolation, in Chrome)
        run: npm run security
